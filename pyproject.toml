[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tranceatables-food-delivery-system"
version = "0.8.0"
description = "Simulation-only food delivery with persisted abstract meal plans, Grist, and Sheety adapters"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8,<9", "mcp>=2,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
